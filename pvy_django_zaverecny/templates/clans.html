{% extends 'base.html' %}

{% block content %}
<h1>🛡 Klany</h1>

<div class="row">
    {% for clan in clans %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h4>{{ clan.name }}</h4>
                <p>Vytvořen: {{ clan.created_at }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
