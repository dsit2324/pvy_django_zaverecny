{% extends 'base.html' %}

{% block content %}
<h1>🏟 Arény</h1>

<div class="row">
    {% for arena in arenas %}
    <div class="col-md-4 mb-3">
        <div class="card">
            <div class="card-body">
                <h4>{{ arena.name }}</h4>
                <p>Výhry: {{ arena.min_battles_won }} - {{ arena.max_battles_won }}</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
