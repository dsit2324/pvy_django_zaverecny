<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Clash Royale Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            min-height: 100vh;
        }

        .navbar {
            background-color: #1f3c88;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .card-custom {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .hero {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-top: 30px;
            text-align: center;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="/">⚔ Clash Royale DB</a>

        <div class="navbar-nav">
            <a class="nav-link" href="/players/">Hráči</a>
            <a class="nav-link" href="/cards/">Karty</a>
            <a class="nav-link" href="/battles/">Souboje</a>
            <a class="nav-link" href="/clans/">Clany</a>
            <a class="nav-link" href="/arenas/">Arény</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}
    {% endblock %}
</div>

<footer>
    Clash Royale Django Project © 2026
</footer>

</body>
</html>
