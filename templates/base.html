<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Clash Royale Database</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Reset výchozích okrajů, aby nevznikaly mezery */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        /* Layout: full-height page with footer stuck to bottom */
        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: #1f3c88;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }

        .card-custom {
            border: none;
            border-radius: 15px;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card-custom:hover {
            transform: translateY(-5px);
        }

        .hero {
            background: linear-gradient(to bottom, #4facfe, #00f2fe);
            border-radius: 20px;
            padding: 40px;
            margin-top: 30px;
            text-align: center;
            color: white;
        }

        footer {
            background-color: #1f3c88;
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: white;
        }

        /* Make the main content area expand to fill available space */
        .content-wrap {
            flex: 1 0 auto;
        }

        .user-info {
            color: white;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                ⚔ Clash Royale DB
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">

                <div class="navbar-nav">
                    <a class="nav-link" href="/players/">👤 Hráči</a>
                    <a class="nav-link" href="/cards/">🃏 Karty</a>
                    <a class="nav-link" href="/battles/">⚔ Souboje</a>
                    <a class="nav-link" href="/clans/">🛡 Klany</a>
                    <a class="nav-link" href="/arenas/">🏟 Arény</a>
                </div>

                <div class="ms-auto d-flex align-items-center">
                    {% if user.is_authenticated %}
                        <span class="user-info">👑 {{ user.username }}</span>
                        {% if user.is_staff %}
                            <a href="/admin/" class="btn btn-warning btn-sm me-2">⚙ Admin</a>
                        {% endif %}
                        <form action="/logout/" method="post" class="d-inline m-0 p-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger btn-sm">🚪 Odhlásit se</button>
                        </form>
                    {% else %}
                        <a href="/accounts/login/" class="btn btn-primary btn-sm me-2">🔑 Přihlášení</a>
                        <a href="/register/" class="btn btn-success btn-sm">📝 Registrace</a>
                    {% endif %}
                </div>

            </div>

        </div>
    </nav>

    <main class="container py-4 content-wrap">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Dominik Svoboda - IT3 © 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
