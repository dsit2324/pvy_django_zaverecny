{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="text-dark mb-4 fw-bold"><span class="text-warning">🃏</span> Sbírka karet</h1>

    <div class="row">
        {% for card in cards %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card card-custom h-100 shadow-sm border-0">
                <div class="card-body p-4">
                    
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h4 class="fw-bold m-0">{{ card.name }}</h4>
                        <span class="badge bg-purple text-white px-2 py-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 35px; height: 35px; background-color: #a333c8;" title="Elixír">
                            {{ card.elixircost }}
                        </span>
                    </div>

                    <hr class="text-muted opacity-25">

                    <div class="d-flex justify-content-between my-2">
                        <span class="text-muted">✨ Rarita:</span>
                        <span class="fw-bold badge bg-secondary text-capitalize">{{ card.rarity }}</span>
                    </div>

                    <div class="d-flex justify-content-between my-2">
                        <span class="text-muted">⚔️ Typ karty:</span>
                        <span class="fw-bold text-dark">{{ card.type }}</span>
                    </div>

                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
