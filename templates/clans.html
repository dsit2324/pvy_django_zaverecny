{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="mb-4 text-dark fw-bold"><span class="text-success">🛡️</span> Seznam Klanů</h1>

    <div class="row">
        {% for clan in clans %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card card-custom h-100 shadow-sm border-0">
                <div class="card-body p-4 d-flex flex-column justify-content-between">
                    <div>
                        <h4 class="fw-bold text-success mb-3">{{ clan.name }}</h4>
                        <div class="text-muted small">
                            <i class="bi bi-calendar"></i> 📅 Založen: <span class="text-dark fw-semibold">{{ clan.created_at }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
