{% extends 'base.html' %}

{% block content %}

<div class="hero">

    <h1 class="display-3 fw-bold text-primary">
        👑 Clash Royale Database
    </h1>

    <p class="lead">
        Prozkoumej hráče, legendární karty, klany, arény a epické souboje.
    </p>

    <hr>

    <div class="row text-center mt-4">

        <div class="col-md-4 mb-3">
            <a href="/players/" class="btn btn-primary btn-lg w-100">
                👤 Hráči
            </a>
        </div>

        <div class="col-md-4 mb-3">
            <a href="/cards/" class="btn btn-warning btn-lg w-100">
                🃏 Karty
            </a>
        </div>

        <div class="col-md-4 mb-3">
            <a href="/battles/" class="btn btn-danger btn-lg w-100">
                ⚔ Souboje
            </a>
        </div>

    </div>

    <div class="row mt-5">

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h2>{{ players_count }}</h2>
                    <p>Registrovaných hráčů</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h2>{{ cards_count }}</h2>
                    <p>Karet ve hře</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h2>{{ battles_count }}</h2>
                    <p>Odehraných soubojů</p>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
