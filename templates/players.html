{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="text-dark mb-4 fw-bold"><span class="text-primary">👤</span> Síň Hráčů</h1>

    <div class="row">
        {% for player in players %}
        <div class="col-md-6 col-lg-4 mb-4">
            <div class="card card-custom h-100 shadow-sm border-0">
                <div class="card-body p-4 d-flex flex-column justify-content-between">
                    <div>
                        <h4 class="fw-bold text-dark mb-3">{{ player.username }}</h4>
                        <p class="text-muted mb-4 fs-5">
                            🏆 Výhry: <span class="badge bg-warning text-dark fw-bold">{{ player.battles_won }}</span>
                        </p>
                    </div>
                    
                    <a href="/players/{{ player.id }}/" class="btn btn-primary w-100 rounded-3 shadow-sm fw-bold">
                        🔍 Zobrazit Profil
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
