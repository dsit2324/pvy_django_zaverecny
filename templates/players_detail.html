{% extends 'base.html' %}

{% block content %}

<div class="card card-custom">

    <div class="card-body">

        <h1>{{ player.username }}</h1>

        <hr>

        <p><strong>🏆 Výhry:</strong> {{ player.battles_won }}</p>

        <p><strong>🏟 Aréna:</strong> {{ player.arena }}</p>

        <p><strong>👥 Clan:</strong> {{ player.clan }}</p>

        <a href="/players/" class="btn btn-secondary">
            Zpět
        </a>

    </div>

</div>

{% endblock %}
